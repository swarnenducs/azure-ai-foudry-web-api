[project]
name = "fastapi-web-app"
version = "0.1.0"
description = "FastAPI web app that invokes Azure AI Foundry agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11.0",
    # Foundry 2.x SDK; requires openai>=2.8.0 (shared with langchain-openai)
    "azure-ai-projects>=2.2.0",
    "azure-identity>=1.19.0",
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.3.0",
    "openai>=2.26.0,<3.0.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
